      - name: Process and Upload sequentially
        env:
          URLS: ${{ inputs.url }}
          EXT: ${{ inputs.ext }}
          IS_ARCHIVE: ${{ inputs.is_archive }}
          REFERER: ${{ inputs.referer }}
          USER_AGENT: ${{ inputs.user_agent }}
          OPENLIST_ADMIN_PASS: ${{ secrets.OPENLIST_ADMIN_PASSWORD }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail

          # ================= 动态摘要初始化 =================
          CLEAN_TAGS=$(echo "$TAGS" | tr ', ' '__' | sed 's#[/\\:*?"<>|]##g')
          [ -z "$CLEAN_TAGS" ] && CLEAN_TAGS="upload"
          DEST="${CRYPT_MOUNT}/${CLEAN_TAGS}"

          # 记录开始时间
          START_TS=$(date +%s)
          START_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')

          # 初始化错误统计与重命名列表文件
          ERROR_COUNT=0
          RENAME_LIST=""

          # 提前写入摘要头部
          {
            echo "## 📦 Upload Task: ${CLEAN_TAGS}"
            echo ""
            echo "| 全局参数 | 值 |"
            echo "| :--- | :--- |"
            echo "| **目标目录** | \`$DEST\` |"
            echo "| **是否为压缩包** | \`$IS_ARCHIVE\` |"
            echo "| **强制扩展名** | \`${EXT:-自动推断}\` |"
            echo "| **Referer** | \`${REFERER:-无}\` |"
            echo "| **开始时间** | $START_TIME |"
            echo ""
            echo "### 📄 文件处理详情"
            echo "| # | 原始链接 | 最终文件名 | 大小 | 状态 |"
            echo "| :--- | :--- | :--- | :--- | :--- |"
          } >> "$GITHUB_STEP_SUMMARY"

          # 初始化 rclone 配置
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [ol]
          type = webdav
          url = http://localhost:${OPENLIST_PORT}/dav
          vendor = other
          user = admin
          pass = $(rclone obscure "$OPENLIST_ADMIN_PASS")
          EOF

          # 智能切分
          printf '%s' "$URLS" > raw_input.txt
          python3 -c "
          import re
          with open('raw_input.txt', 'r', encoding='utf-8') as f:
              content = f.read()
          parts = re.split(r'(?=https?://)', content)
          with open('urls_list.txt', 'w', encoding='utf-8') as f:
              for p in parts:
                  p = p.strip()
                  if p:
                      f.write(p + '\n')
          "

          INDEX=1
          TOTAL_BYTES=0

          while IFS= read -r line; do
            [ -z "$line" ] && continue

            echo "=================================================="
            echo "[$INDEX] 正在处理: $line"

            # 解析链接和文件名
            RAW_URL="$line"
            CUSTOM_NAME=""
            if [[ "$line" == *"|"* ]]; then
              RAW_URL="${line%%|*}"
              CUSTOM_NAME="${line#*|}"
            fi

            # 剥离 ?f=
            if [[ "$RAW_URL" == *"?f="* ]]; then
              BASE_URL="${RAW_URL%%\?*}"
              QUERY="${RAW_URL#*\?}"
              E_PARAM=$(echo "$QUERY" | grep -o 'e=[^&]*' || true)
              S_PARAM=$(echo "$QUERY" | grep -o 's=[^&]*' || true)
              CLEAN_QS=""
              if [ -n "$E_PARAM" ]; then CLEAN_QS="$E_PARAM"; fi
              if [ -n "$S_PARAM" ]; then CLEAN_QS="${CLEAN_QS:+$CLEAN_QS&}$S_PARAM"; fi
              if [ -n "$CLEAN_QS" ]; then RAW_URL="$BASE_URL?$CLEAN_QS"; else RAW_URL="$BASE_URL"; fi
            fi
            PURE_URL="$RAW_URL"

            # 预获取文件大小
            UA="${USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36}"
            HEAD_ARGS=(-sIL --connect-timeout 10 -A "$UA")
            if [ -n "$REFERER" ]; then HEAD_ARGS+=(-e "$REFERER"); fi
            
            FILE_SIZE_BYTES=$(curl "${HEAD_ARGS[@]}" "$PURE_URL" | grep -i '^content-length:' | tail -n1 | awk '{print $2}' | tr -d '\r' || echo "0")
            if [ -z "$FILE_SIZE_BYTES" ] || [ "$FILE_SIZE_BYTES" -eq 0 ]; then
               HUMAN_SIZE="未知"
               FILE_SIZE_BYTES=0
            else
               HUMAN_SIZE=$(numfmt --to=iec-i --suffix=B "$FILE_SIZE_BYTES")
               TOTAL_BYTES=$((TOTAL_BYTES + FILE_SIZE_BYTES))
            fi

            mkdir -p "work/download" "work/output/videos" "work/output/thumbs"

            echo "-> 下载中..."
            CURL_ARGS=(-fL --retry 3 --retry-delay 5 --connect-timeout 30 -A "$UA")
            if [ -n "$REFERER" ]; then CURL_ARGS+=(-e "$REFERER"); fi

            if ! curl "${CURL_ARGS[@]}" -o "work/download/source.bin" "$RAW_URL"; then
               echo "::error::下载失败 $RAW_URL"
               echo "| $INDEX | \`$PURE_URL\` | - | $HUMAN_SIZE | ❌ 下载失败 |" >> "$GITHUB_STEP_SUMMARY"
               ERROR_COUNT=$((ERROR_COUNT + 1))
               INDEX=$((INDEX + 1))
               continue
            fi

            # 重命名逻辑
            FINAL_NAME="source.mp4"
            if [ "$IS_ARCHIVE" != "true" ]; then
              ext="$EXT"
              if [ -n "$CUSTOM_NAME" ]; then
                FINAL_NAME=$(echo "$CUSTOM_NAME" | sed 's#[/\\:*?"<>|]#_#g')
                if [[ "$FINAL_NAME" != *.* ]]; then
                   if [ -z "$ext" ]; then
                      url_path="${RAW_URL%%\?*}"
                      ext="$(basename "$url_path" | sed -n 's/.*\.\([A-Za-z0-9]\{1,5\}\)$/\1/p')"
                      [ -z "$ext" ] && ext="mp4"
                   fi
                   FINAL_NAME="$FINAL_NAME.$ext"
                fi
              else
                if [ -z "$ext" ]; then
                  url_path="${RAW_URL%%\?*}"
                  ext="$(basename "$url_path" | sed -n 's/.*\.\([A-Za-z0-9]\{1,5\}\)$/\1/p')"
                  [ -z "$ext" ] && ext="mp4"
                fi
                FINAL_NAME="source.$ext"
              fi
            fi
            mv "work/download/source.bin" "work/download/$FINAL_NAME"

            # 处理压缩包
            if [ "$IS_ARCHIVE" == "true" ]; then
               echo "-> 解压中..."
               7z x -y -owork/extracted "work/download/$FINAL_NAME" >/dev/null
               find work/extracted -type f | while read -r f; do
                 if [[ "$f" =~ \.(mp4|mkv|avi|mov|flv|wmv|ts|m2ts|webm|m4v|mpg|mpeg|rmvb|3gp)$ ]]; then
                   mkdir -p "work/output/videos/$(dirname "${f#work/extracted/}")"
                   mv "$f" "work/output/videos/${f#work/extracted/}"
                 fi
               done
               rm -rf work/extracted "work/download/$FINAL_NAME"
               FINAL_NAME="📦 压缩包解压内容"
            else
               mv "work/download/$FINAL_NAME" "work/output/videos/"
            fi

            # 修复 Faststart
            echo "-> 修复 Faststart..."
            find work/output/videos -type f | while read -r f; do
              if ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$f" >/dev/null 2>&1; then
                trace=$(ffprobe -v trace -i "$f" 2>&1 || true)
                moov_line=$(echo "$trace" | grep -n "type:'moov'" | head -1 | cut -d: -f1 || echo 0)
                mdat_line=$(echo "$trace" | grep -n "type:'mdat'" | head -1 | cut -d: -f1 || echo 0)
                if [ "$moov_line" != "0" ] && [ "$mdat_line" != "0" ] && [ "$moov_line" -gt "$mdat_line" ]; then
                  ffmpeg -y -v error -i "$f" -c copy -movflags +faststart "$f.tmp.mp4" && mv "$f.tmp.mp4" "$f"
                fi
              fi
            done

            # 生成缩略图
            echo "-> 生成缩略图..."
            find work/output/videos -type f | while read -r f; do
              rel="${f#work/output/videos/}"
              thumb_dir="work/output/thumbs/$(dirname "$rel")/.thumbnails"
              mkdir -p "$thumb_dir"
              dur=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" || echo 10)
              at=$(awk -v d="$dur" 'BEGIN{print (d>10)?int(d*0.1):1}')
              ffmpeg -y -v error -ss "$at" -i "$f" -frames:v 1 -vf "scale=-2:320" "$thumb_dir/$(basename "${rel%.*}").webp" 2>/dev/null || true
            done

            # 上传
            echo "-> 上传至移动云盘..."
            UPLOAD_STATUS="✅ 上传成功"
            if ! rclone copy "work/output/videos" "ol:$DEST" --transfers 1 --multi-thread-streams 2 --timeout 30m --retries 3 -P; then
               UPLOAD_STATUS="❌ 上传失败"
               ERROR_COUNT=$((ERROR_COUNT + 1))
            fi

            if [ -d "work/output/thumbs" ]; then
              rclone copy "work/output/thumbs" "ol:$DEST" --transfers 4 -q
            fi

            # 写入单条文件摘要，同时加入可供复用的重命名列表
            echo "| $INDEX | [链接]($PURE_URL) | \`$FINAL_NAME\` | $HUMAN_SIZE | $UPLOAD_STATUS |" >> "$GITHUB_STEP_SUMMARY"
            
            # 如果是普通文件（非压缩包），则追加到重命名复用列表中
            if [ "$IS_ARCHIVE" != "true" ]; then
              RENAME_LIST="${RENAME_LIST}${PURE_URL}|${FINAL_NAME}"$'\n'
            fi

            # 清理
            rm -rf work/download/* work/output/videos/* work/output/thumbs/*
            INDEX=$((INDEX + 1))
          done < urls_list.txt

          # ================= 结束时计算时间与速度 =================
          END_TS=$(date +%s)
          END_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          ELAPSED=$((END_TS - START_TS))
          
          if [ "$ELAPSED" -eq 0 ]; then ELAPSED=1; fi

          if [ "$TOTAL_BYTES" -eq 0 ]; then
            HUMAN_TOTAL="未知"
            SPEED_STR="无法计算"
          else
            HUMAN_TOTAL=$(numfmt --to=iec-i --suffix=B "$TOTAL_BYTES")
            SPEED_BPS=$((TOTAL_BYTES / ELAPSED))
            HUMAN_SPEED=$(numfmt --to=iec-i --suffix=B/s "$SPEED_BPS")
            SPEED_STR="$HUMAN_SPEED"
          fi
          
          FORMAT_TIME=$(printf '%02d:%02d:%02d' $((ELAPSED/3600)) $(((ELAPSED%3600)/60)) $((ELAPSED%60)))
          
          # 如果有报错，生成失败警告
          if [ "$ERROR_COUNT" -gt 0 ]; then
            ERROR_MSG="⚠️ 共有 $ERROR_COUNT 个文件处理失败，请检查上方日志。"
          else
            ERROR_MSG="✅ 所有文件处理完成，无报错。"
          fi

          # 写入最终汇总统计
          {
            echo ""
            echo "### 📊 运行汇总"
            echo "| 指标 | 数值 |"
            echo "| :--- | :--- |"
            echo "| **开始时间** | $START_TIME |"
            echo "| **结束时间** | $END_TIME |"
            echo "| **总耗时** | $FORMAT_TIME |"
            echo "| **总处理大小** | $HUMAN_TOTAL |"
            echo "| **等效速度** | $SPEED_STR |"
            echo "| **运行状态** | $ERROR_MSG |"
            echo ""
            echo "> 远端存储统计："
            echo "\`\`\`"
            rclone size "ol:$DEST"
            echo "\`\`\`"
            
            # 如果有可供复用的重命名列表，则将其附在最后
            if [ -n "$RENAME_LIST" ]; then
              echo ""
              echo "### 📋 可复用的下载链接与重命名列表"
              echo "> 您可以直接复制下面文本框中的内容，在下次触发时粘贴到 URL 输入框中。"
              echo "\`\`\`text"
              printf "%s" "$RENAME_LIST"
              echo "\`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
