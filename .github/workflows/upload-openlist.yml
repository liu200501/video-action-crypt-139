name: Upload to OpenList Crypt
run-name: "📦 ${{ inputs.tags || 'Auto' }} (Upload to OpenList)"

on:
  workflow_dispatch:
    inputs:
      url:
        description: "下载链接。支持多行粘贴，包含 '链接|自定义文件名' 即可"
        required: true
        type: string
      tags:
        description: "目标文件夹名"
        required: true
        type: string
      is_archive:
        description: "下载的是压缩包吗？"
        required: true
        default: false
        type: boolean
      ext:
        description: "非压缩包时的扩展名（留空自动推断）"
        required: false
        default: ""
        type: string
      referer:
        description: "Referer (防防盗链)"
        required: false
        default: "https://pawchive.pw/"
        type: string
      user_agent:
        description: "User-Agent（留空默认 Chrome）"
        required: false
        default: ""
        type: string

env:
  OPENLIST_PORT: 5244
  # ⚠️ 方案 A：这个路径现在必须是 OpenList 里的【普通存储目录】，不能是 Crypt 挂载点
  CRYPT_MOUNT: /加密存储
  DOCKER_IMAGE: openlistteam/openlist:latest
  WORK_DIR: ${{ github.workspace }}/work
  SECRET_DIR: openlist-secrets

jobs:
  upload:
    name: "Upload: ${{ inputs.tags }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: openlist-crypt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ==================== 0. 清理磁盘 ====================
      - name: Free up disk space
        run: |
          echo "=== 清理前 ==="
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af
          echo "=== 清理后 ==="
          df -h

      # ==================== 1. 拉取私有配置 ====================
      - name: Checkout secrets repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SECRET_REPO }}
          token: ${{ secrets.OPENLIST_SECRETS_TOKEN }}
          path: openlist-secrets

      - name: Restore OpenList config
        env:
          OPENLIST_CONFIG_JSON_B64: ${{ secrets.OPENLIST_CONFIG_JSON_B64 }}
          OPENLIST_DB_GPG_PASS: ${{ secrets.OPENLIST_DB_GPG_PASS }}
        run: |
          set -euo pipefail
          mkdir -p openlist/data
          printf '%s' "$OPENLIST_CONFIG_JSON_B64" | base64 -d > openlist/data/config.json
          gpg --batch --yes --pinentry-mode loopback --passphrase "$OPENLIST_DB_GPG_PASS" --decrypt "${SECRET_DIR}/data.db.gpg" > openlist/data/data.db
          if [ -f "${SECRET_DIR}/data.db-wal.gpg" ]; then
            gpg --batch --yes --pinentry-mode loopback --passphrase "$OPENLIST_DB_GPG_PASS" --decrypt "${SECRET_DIR}/data.db-wal.gpg" > openlist/data/data.db-wal
          fi

      # ==================== 2. 安装系统工具 ====================
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg p7zip-full zip jq curl rclone file
          pip install Pillow -q

      # ==================== 3. 启动 OpenList 容器 ====================
      - name: Start OpenList container
        run: |
          docker run -d --name openlist -p ${OPENLIST_PORT}:5244 -v "${{ github.workspace }}/openlist/data:/opt/openlist/data" ${DOCKER_IMAGE}
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${OPENLIST_PORT}/ping" >/dev/null 2>&1; then break; fi
            sleep 2
          done

      # ==================== 3.5 准备 rclone 配置（仅用于统计，上传走 fs/put API）====================
      - name: Prepare rclone config (stats only)
        env:
          OPENLIST_ADMIN_PASS: ${{ secrets.OPENLIST_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [ol]
          type = webdav
          url = http://localhost:${OPENLIST_PORT}/dav
          vendor = other
          user = admin
          pass = $(rclone obscure "$OPENLIST_ADMIN_PASS")
          EOF
          rclone lsd "ol:${CRYPT_MOUNT}" || { echo "::error::rclone webdav remote 无法列出，请检查 OpenList 目录与管理密码"; exit 1; }
          echo "rclone webdav remote OK"

      # ==================== 4. 核心：处理、上传与摘要 ====================
      - name: Process and Upload sequentially
        env:
          URLS: ${{ inputs.url }}
          EXT: ${{ inputs.ext }}
          IS_ARCHIVE: ${{ inputs.is_archive }}
          REFERER: ${{ inputs.referer }}
          USER_AGENT: ${{ inputs.user_agent }}
          OPENLIST_ADMIN_PASS: ${{ secrets.OPENLIST_ADMIN_PASSWORD }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail

          # ================= 动态摘要初始化 =================
          CLEAN_TAGS=$(echo "$TAGS" | tr ', ' '__' | sed 's#[/\\:*?"<>|]##g')
          [ -z "$CLEAN_TAGS" ] && CLEAN_TAGS="upload"
          # 目标目录（OpenList 视角的绝对路径）
          DEST="${CRYPT_MOUNT}/${CLEAN_TAGS}"

          # ================= 获取 OpenList API Token =================
          echo "-> 获取 OpenList API Token..."
          LOGIN_RESP=$(curl -sS -X POST "http://localhost:${OPENLIST_PORT}/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg u admin --arg p "$OPENLIST_ADMIN_PASS" '{username: $u, password: $p}')")
          OPENLIST_TOKEN=$(printf '%s' "$LOGIN_RESP" | jq -r '.data.token // empty')
          if [ -z "$OPENLIST_TOKEN" ] || [ "$OPENLIST_TOKEN" = "null" ]; then
            echo "::error::获取 OpenList API Token 失败，请检查 OPENLIST_ADMIN_PASSWORD"
            exit 1
          fi
          echo "OpenList API Token 获取成功"

          # ================= OpenList fs/put 上传函数 =================
          # openlist_put <本地文件> <OpenList 绝对路径>
          openlist_put() {
            local src="$1"
            local dst="$2"
            local encoded
            encoded=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe="/"))' "$dst")
            local url="http://localhost:${OPENLIST_PORT}/api/fs/put"
            local body http_code resp code
            body=$(curl -sS -X PUT "$url" \
              --upload-file "$src" \
              --max-time 1800 --retry 2 --retry-delay 5 \
              -H "Authorization: $OPENLIST_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              -H "File-Path: $encoded" \
              -w '\n%{http_code}' 2>&1) || true
            http_code=$(printf '%s' "$body" | tail -n1)
            resp=$(printf '%s' "$body" | sed '$d')
            if [ "$http_code" != "200" ]; then
              echo "::error::上传失败 HTTP $http_code: $dst"
              echo "响应: $resp"
              return 1
            fi
            code=$(printf '%s' "$resp" | jq -r '.code // empty' 2>/dev/null || true)
            if [ "$code" != "200" ]; then
              echo "::error::上传失败 code=${code:-未知}: $dst"
              echo "响应: $resp"
              return 1
            fi
            return 0
          }

          # openlist_put_dir <本地目录> <OpenList 绝对目标目录>（递归）
          openlist_put_dir() {
            local src_dir="$1"
            local dst_dir="$2"
            local fail=0
            while IFS= read -r -d '' f; do
              local rel="${f#"$src_dir"/}"
              echo "  PUT -> $dst_dir/$rel"
              openlist_put "$f" "$dst_dir/$rel" || fail=$((fail + 1))
            done < <(find "$src_dir" -type f -print0)
            return "$fail"
          }

          # 记录开始时间
          START_TS=$(date +%s)
          START_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')

          ERROR_COUNT=0
          RENAME_LIST=""

          {
            echo "## 📦 Upload Task: ${CLEAN_TAGS}"
            echo ""
            echo "| 全局参数 | 值 |"
            echo "| :--- | :--- |"
            echo "| **目标目录** | \`$DEST\` |"
            echo "| **上传方式** | \`OpenList /api/fs/put\` |"
            echo "| **是否为压缩包** | \`$IS_ARCHIVE\` |"
            echo "| **强制扩展名** | \`${EXT:-自动推断}\` |"
            echo "| **开始时间** | $START_TIME |"
            echo ""
            echo "### 📄 文件处理详情"
            echo "| # | 原始链接 | 最终文件名 | 大小 | 状态 |"
            echo "| :--- | :--- | :--- | :--- | :--- |"
          } >> "$GITHUB_STEP_SUMMARY"

          # 智能切分链接
          printf '%s' "$URLS" > raw_input.txt
          python3 -c "
          import re
          with open('raw_input.txt', 'r', encoding='utf-8') as f:
              content = f.read()
          parts = re.split(r'(?=https?://)', content)
          with open('urls_list.txt', 'w', encoding='utf-8') as f:
              for p in parts:
                  p = p.strip()
                  if p:
                      f.write(p + '\n')
          "

          INDEX=1
          TOTAL_BYTES=0

          # ================= 循环下载与处理 =================
          while IFS= read -r line; do
            [ -z "$line" ] && continue

            echo "=================================================="
            echo "[$INDEX] 正在处理: $line"

            RAW_URL="$line"
            CUSTOM_NAME=""
            if [[ "$line" == *"|"* ]]; then
              RAW_URL="${line%%|*}"
              CUSTOM_NAME="${line#*|}"
            fi

            # 剥离 ?f=
            if [[ "$RAW_URL" == *"?f="* ]]; then
              BASE_URL="${RAW_URL%%\?*}"
              QUERY="${RAW_URL#*\?}"
              E_PARAM=$(echo "$QUERY" | grep -o 'e=[^&]*' || true)
              S_PARAM=$(echo "$QUERY" | grep -o 's=[^&]*' || true)
              CLEAN_QS=""
              if [ -n "$E_PARAM" ]; then CLEAN_QS="$E_PARAM"; fi
              if [ -n "$S_PARAM" ]; then CLEAN_QS="${CLEAN_QS:+$CLEAN_QS&}$S_PARAM"; fi
              if [ -n "$CLEAN_QS" ]; then RAW_URL="$BASE_URL?$CLEAN_QS"; else RAW_URL="$BASE_URL"; fi
            fi
            PURE_URL="$RAW_URL"

            # 预获取文件大小
            UA="${USER_AGENT:-Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36}"
            HEAD_ARGS=(-sIL --connect-timeout 10 -A "$UA")
            if [ -n "$REFERER" ]; then HEAD_ARGS+=(-e "$REFERER"); fi

            FILE_SIZE_BYTES=$(curl "${HEAD_ARGS[@]}" "$PURE_URL" | grep -i '^content-length:' | tail -n1 | awk '{print $2}' | tr -d '\r' || echo "0")
            if [ -z "$FILE_SIZE_BYTES" ] || [ "$FILE_SIZE_BYTES" -eq 0 ]; then
               HUMAN_SIZE="未知"
               FILE_SIZE_BYTES=0
            else
               HUMAN_SIZE=$(numfmt --to=iec-i --suffix=B "$FILE_SIZE_BYTES")
               TOTAL_BYTES=$((TOTAL_BYTES + FILE_SIZE_BYTES))
            fi

            mkdir -p "work/download" "work/output/videos"

            echo "-> 下载中..."
            CURL_ARGS=(-fL --retry 3 --retry-delay 5 --connect-timeout 30 -A "$UA")
            if [ -n "$REFERER" ]; then CURL_ARGS+=(-e "$REFERER"); fi

            set +e
            curl "${CURL_ARGS[@]}" -o "work/download/source.bin" "$RAW_URL"
            CURL_EXIT=$?
            set -e

            if [ "$CURL_EXIT" -ne 0 ]; then
               echo "::error::下载失败 $RAW_URL"
               echo "| $INDEX | \`$PURE_URL\` | - | $HUMAN_SIZE | ❌ 下载失败 |" >> "$GITHUB_STEP_SUMMARY"
               ERROR_COUNT=$((ERROR_COUNT + 1))
               INDEX=$((INDEX + 1))
               continue
            fi

            # 重命名逻辑
            FINAL_NAME="source.mp4"
            if [ "$IS_ARCHIVE" != "true" ]; then
              ext="$EXT"
              if [ -n "$CUSTOM_NAME" ]; then
                FINAL_NAME=$(echo "$CUSTOM_NAME" | sed 's#[/\\:*?"<>|]#_#g')
                if [[ "$FINAL_NAME" != *.* ]]; then
                   if [ -z "$ext" ]; then
                      url_path="${RAW_URL%%\?*}"
                      ext="$(basename "$url_path" | sed -n 's/.*\.\([A-Za-z0-9]\{1,5\}\)$/\1/p')"
                      [ -z "$ext" ] && ext="mp4"
                   fi
                   FINAL_NAME="$FINAL_NAME.$ext"
                fi
              else
                if [ -z "$ext" ]; then
                  url_path="${RAW_URL%%\?*}"
                  ext="$(basename "$url_path" | sed -n 's/.*\.\([A-Za-z0-9]\{1,5\}\)$/\1/p')"
                  [ -z "$ext" ] && ext="mp4"
                fi
                FINAL_NAME="source.$ext"
              fi
            fi
            mv "work/download/source.bin" "work/download/$FINAL_NAME"

            if [ "$IS_ARCHIVE" == "true" ]; then
               echo "-> 解压中..."
               7z x -y -owork/extracted "work/download/$FINAL_NAME" >/dev/null 2>&1 || true
               find work/extracted -type f 2>/dev/null | while read -r f; do
                 if [[ "$f" =~ \.(mp4|mkv|avi|mov|flv|wmv|ts|m2ts|webm|m4v|mpg|mpeg|rmvb|3gp)$ ]]; then
                   mkdir -p "work/output/videos/$(dirname "${f#work/extracted/}")"
                   mv "$f" "work/output/videos/${f#work/extracted/}"
                 fi
               done
               rm -rf work/extracted "work/download/$FINAL_NAME"
               FINAL_NAME="📦 压缩包解压内容"
            else
               mv "work/download/$FINAL_NAME" "work/output/videos/"
            fi

            echo "-> 修复 Faststart..."
            find work/output/videos -type f | while read -r f; do
              if ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$f" >/dev/null 2>&1; then
                trace=$(ffprobe -v trace -i "$f" 2>&1 || true)
                moov_line=$(echo "$trace" | grep -n "type:'moov'" | head -1 | cut -d: -f1 || echo 0)
                mdat_line=$(echo "$trace" | grep -n "type:'mdat'" | head -1 | cut -d: -f1 || echo 0)
                if [ "$moov_line" != "0" ] && [ "$mdat_line" != "0" ] && [ "$moov_line" -gt "$mdat_line" ]; then
                  ffmpeg -y -v error -i "$f" -c copy -movflags +faststart "$f.tmp.mp4" && mv "$f.tmp.mp4" "$f"
                fi
              fi
            done

            # ================= 上传（调用 OpenList /api/fs/put）=================
            echo "-> 上传至 OpenList（fs/put API）..."
            UPLOAD_STATUS="✅ 上传成功"

            set +e
            openlist_put_dir "work/output/videos" "$DEST"
            PUT_FAIL=$?
            set -e

            if [ "$PUT_FAIL" -ne 0 ]; then
               UPLOAD_STATUS="❌ 上传失败 ($PUT_FAIL 个文件失败)"
               ERROR_COUNT=$((ERROR_COUNT + 1))
            fi

            echo "| $INDEX | [链接]($PURE_URL) | \`$FINAL_NAME\` | $HUMAN_SIZE | $UPLOAD_STATUS |" >> "$GITHUB_STEP_SUMMARY"

            if [ "$IS_ARCHIVE" != "true" ]; then
              RENAME_LIST="${RENAME_LIST}${PURE_URL}|${FINAL_NAME}"$'\n'
            fi

            rm -rf work/download/* work/output/videos/*
            INDEX=$((INDEX + 1))
          done < urls_list.txt

          # ================= 加入 Python 脚本生成缩略图 =================
          echo "=================================================="
          echo "-> 开始批量生成缩略图 (并发模式)..."

          cat > gen_thumb.py << 'PYEOF'
          import os
          import subprocess
          import sys
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from PIL import Image

          CAPTURE_TIME = "00:00:01"
          MAX_SIZE = 320
          WEBP_QUALITY = 80
          MAX_WORKERS = min(8, (os.cpu_count() or 4))

          VIDEO_EXTENSIONS = {'.mp4', '.mkv', '.avi', '.mov', '.wmv', '.flv', '.ts', '.m2ts', '.webm'}
          IMAGE_EXTENSIONS = {'.jpg', '.jpeg', '.png', '.gif', '.bmp', '.tiff', '.webp'}

          def get_ffmpeg():
              exe_dir = os.path.dirname(os.path.abspath(sys.argv[0]))
              local_ffmpeg = os.path.join(exe_dir, "ffmpeg.exe")
              if os.path.isfile(local_ffmpeg):
                  return local_ffmpeg
              return "ffmpeg"

          def generate_video_thumbnail(video_path, thumb_path, ffmpeg):
              cmd = [
                  ffmpeg, "-y",
                  "-ss", CAPTURE_TIME, "-i", video_path,
                  "-ss", "00:00:01",
                  "-vframes", "1",
                  "-vf", f"scale={MAX_SIZE}:-2",
                  "-threads", "1",
                  "-c:v", "libwebp", "-quality", str(WEBP_QUALITY),
                  thumb_path
              ]
              try:
                  subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True, timeout=120)
                  return True
              except (subprocess.CalledProcessError, subprocess.TimeoutExpired):
                  cmd_fallback = [
                      ffmpeg, "-y", "-i", video_path, "-vframes", "1",
                      "-vf", f"scale={MAX_SIZE}:-2", "-threads", "1",
                      "-c:v", "libwebp", "-quality", str(WEBP_QUALITY), thumb_path
                  ]
                  try:
                      subprocess.run(cmd_fallback, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=True, timeout=120)
                      return True
                  except Exception:
                      if os.path.exists(thumb_path):
                          try: os.remove(thumb_path)
                          except OSError: pass
                      return False

          def generate_image_thumbnail(image_path, thumb_path):
              try:
                  with Image.open(image_path) as img:
                      if img.format == "JPEG":
                          img.draft("RGB", (MAX_SIZE * 2, MAX_SIZE * 2))
                      if img.mode in ("RGBA", "P", "LA"):
                          img = img.convert("RGB")
                      img.thumbnail((MAX_SIZE, MAX_SIZE), Image.Resampling.BILINEAR)
                      img.save(thumb_path, "WEBP", quality=WEBP_QUALITY, method=4)
                  return True
              except Exception:
                  if os.path.exists(thumb_path):
                      try: os.remove(thumb_path)
                      except OSError: pass
                  return False

          def process_one(media_path, thumb_path, ext, ffmpeg):
              if os.path.exists(thumb_path): return ("skip", os.path.basename(media_path))
              if ext in VIDEO_EXTENSIONS:
                  ok = generate_video_thumbnail(media_path, thumb_path, ffmpeg)
                  return ("video_ok" if ok else "video_fail", os.path.basename(media_path))
              elif ext in IMAGE_EXTENSIONS:
                  ok = generate_image_thumbnail(media_path, thumb_path)
                  return ("image_ok" if ok else "image_fail", os.path.basename(media_path))
              return ("unknown", os.path.basename(media_path))

          def main():
              target_dir = sys.argv[1] if len(sys.argv) > 1 else os.getcwd()
              if not os.path.isdir(target_dir): return
              ffmpeg = get_ffmpeg()

              tasks = []
              for root, dirs, files in os.walk(target_dir):
                  if '.thumbnails' in dirs: dirs.remove('.thumbnails')
                  medias = [f for f in files if os.path.splitext(f)[1].lower() in (VIDEO_EXTENSIONS | IMAGE_EXTENSIONS)]
                  if not medias: continue
                  thumb_dir = os.path.join(root, ".thumbnails")
                  os.makedirs(thumb_dir, exist_ok=True)
                  for media in medias:
                      # 注意这里：OpenList 要求缩略图名为 [原文件名.原扩展名.webp]
                      tasks.append((os.path.join(root, media), os.path.join(thumb_dir, f"{media}.webp"), os.path.splitext(media)[1].lower()))

              if not tasks: return

              stats = {"skip": 0, "video_ok": 0, "video_fail": 0, "image_ok": 0, "image_fail": 0, "unknown": 0}
              with ThreadPoolExecutor(max_workers=MAX_WORKERS) as pool:
                  futures = {pool.submit(process_one, mp, tp, ext, ffmpeg): mp for (mp, tp, ext) in tasks}
                  for fut in as_completed(futures):
                      try:
                          status, name = fut.result()
                          stats[status] = stats.get(status, 0) + 1
                          print(f"  [{status}] {name}")
                      except Exception as e:
                          print(f"  [异常] {e}")

              success = stats["skip"] + stats["video_ok"] + stats["image_ok"]
              failed = stats["video_fail"] + stats["image_fail"] + stats["unknown"]
              print(f"✅ 缩略图生成完成！成功 {success}，失败 {failed}")

          if __name__ == "__main__":
              main()
          PYEOF

          # 执行 Python 脚本批量生成缩略图
          python3 gen_thumb.py "work/output/videos"

          # 将生成的缩略图逐个上传（OpenList /api/fs/put）
          echo "-> 上传缩略图至云端..."
          if [ -d "work/output/videos" ]; then
            THUMB_FAIL=0
            while IFS= read -r -d '' t; do
              rel="${t#work/output/videos/}"
              openlist_put "$t" "$DEST/$rel" || THUMB_FAIL=$((THUMB_FAIL + 1))
            done < <(find "work/output/videos" -type f -path '*/.thumbnails/*' -print0)
            if [ "$THUMB_FAIL" -ne 0 ]; then
              echo "::warning::有 $THUMB_FAIL 个缩略图上传失败"
            else
              echo "缩略图上传完成"
            fi
          fi

          # 清理临时生成脚本
          rm -f gen_thumb.py

          # ================= 结束时计算时间与速度 =================
          END_TS=$(date +%s)
          END_TIME=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          ELAPSED=$((END_TS - START_TS))

          if [ "$ELAPSED" -eq 0 ]; then ELAPSED=1; fi

          if [ "$TOTAL_BYTES" -eq 0 ]; then
            HUMAN_TOTAL="未知"
            SPEED_STR="无法计算"
          else
            HUMAN_TOTAL=$(numfmt --to=iec-i --suffix=B "$TOTAL_BYTES")
            SPEED_BPS=$((TOTAL_BYTES / ELAPSED))
            HUMAN_SPEED=$(numfmt --to=iec-i --suffix=B/s "$SPEED_BPS")
            SPEED_STR="$HUMAN_SPEED"
          fi

          FORMAT_TIME=$(printf '%02d:%02d:%02d' $((ELAPSED/3600)) $(((ELAPSED%3600)/60)) $((ELAPSED%60)))

          if [ "$ERROR_COUNT" -gt 0 ]; then
            ERROR_MSG="⚠️ 共有 $ERROR_COUNT 个文件处理失败，请检查上方日志。"
          else
            ERROR_MSG="✅ 所有文件处理完成，无报错。"
          fi

          {
            echo ""
            echo "### 📊 运行汇总"
            echo "| 指标 | 数值 |"
            echo "| :--- | :--- |"
            echo "| **开始时间** | $START_TIME |"
            echo "| **结束时间** | $END_TIME |"
            echo "| **总耗时** | $FORMAT_TIME |"
            echo "| **总处理大小** | $HUMAN_TOTAL |"
            echo "| **等效速度** | $SPEED_STR |"
            echo "| **运行状态** | $ERROR_MSG |"
            echo ""
            echo "> 远端存储统计（rclone size，仅用于统计）："
            echo "\`\`\`"
            rclone size "ol:$DEST" || true
            echo "\`\`\`"

            if [ -n "$RENAME_LIST" ]; then
              echo ""
              echo "### 📋 可复用的下载链接与重命名列表"
              echo "> 您可以直接复制下面文本框中的内容，在下次触发时粘贴到 URL 输入框中。"
              echo "\`\`\`text"
              printf "%s" "$RENAME_LIST"
              echo "\`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ==================== 5. 清理容器 ====================
      - name: Dump OpenList logs on failure
        if: failure()
        run: docker logs --tail 200 openlist || true

      - name: Cleanup container
        if: always()
        run: docker rm -f openlist || true
